name: jev-spec

# jev-spec checks itself against docs/specs/. The job is advisory for now: it reports, and it
# never blocks a merge. It becomes a required check once it has been quiet for a while.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    continue-on-error: true

    # The API key is handed only to the step that runs the live check, and only on a push to
    # main, so that pull requests, `npm ci`, the lifecycle scripts of dependencies and the build
    # never see it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A pull request can change the configuration, the specs and the code that would run next
      # to the key, so it only validates the setup.
      - name: Dry run
        if: github.event_name != 'push'
        run: node bin/jev-spec.js check --dry-run --format markdown >> "$GITHUB_STEP_SUMMARY"

      # A full run on purpose: a diff run would skip a push that changes only a spec. Without the
      # secret the key is empty, and jev-spec stops with exit code 2 instead of passing.
      - name: Check the code against the specs
        if: github.event_name == 'push'
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: node bin/jev-spec.js check --format markdown >> "$GITHUB_STEP_SUMMARY"
