name: jev-spec

# jev-spec checks itself against docs/specs/. The job is advisory for now: it reports, and it
# never blocks a merge. It becomes a required check once it has been quiet for a while.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    continue-on-error: true

    # The API key is handed only to the steps that need it, so that `npm ci`, the lifecycle
    # scripts of dependencies and the build never see it.
    steps:
      # Only whether the key is set leaves this step, never its value. It is empty for pull
      # requests from forks: GitHub does not hand secrets to them.
      - name: Check whether an API key is available
        id: api-key
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: |
          if [ -n "$TYPESAFE_AI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Without a key there is nothing to ask the model, so validate the setup instead.
      - name: Dry run (no API key available)
        if: steps.api-key.outputs.available != 'true'
        run: node bin/jev-spec.js check --dry-run --format markdown >> "$GITHUB_STEP_SUMMARY"

      # A full run on purpose, for pull requests too. It costs a fraction of a cent, and a diff run
      # would skip a pull request that changes only a spec.
      - name: Check the code against the specs
        if: steps.api-key.outputs.available == 'true'
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
        run: node bin/jev-spec.js check --format markdown >> "$GITHUB_STEP_SUMMARY"
